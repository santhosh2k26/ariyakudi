<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#ecoGrad)"/>
  
  <!-- Sun & Eco Sky -->
  <circle cx="200" cy="90" r="45" fill="#fef08a" opacity="0.4"/>
  <circle cx="200" cy="90" r="30" fill="#fbbf24"/>

  <!-- Green Earth / Eco Globe with Leaves -->
  <circle cx="200" cy="180" r="90" fill="#10b981"/>
  <circle cx="200" cy="180" r="85" fill="#059669"/>
  
  <!-- Sprouting Plant / Green Leaf Motif -->
  <path d="M 200 160 C 200 100, 150 100, 150 130 C 150 160, 190 160, 200 160 Z" fill="#4ade80"/>
  <path d="M 200 160 C 200 80, 260 80, 260 120 C 260 150, 210 160, 200 160 Z" fill="#22c55e"/>
  <path d="M 200 190 L 200 120" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>

  <!-- Segregated Dustbins (Cleanliness Initiative) -->
  <rect x="70" y="165" width="28" height="40" rx="3" fill="#3b82f6"/>
  <rect x="66" y="160" width="36" height="6" rx="2" fill="#1d4ed8"/>
  <text x="84" y="190" font-family="sans-serif" font-size="7" fill="#ffffff" text-anchor="middle">DRY</text>

  <rect x="300" y="165" width="28" height="40" rx="3" fill="#16a34a"/>
  <rect x="296" y="160" width="36" height="6" rx="2" fill="#15803d"/>
  <text x="314" y="190" font-family="sans-serif" font-size="7" fill="#ffffff" text-anchor="middle">WET</text>

  <!-- Eco Banner -->
  <rect x="110" y="215" width="180" height="25" rx="12" fill="#0f172a" opacity="0.9" stroke="#34d399" stroke-width="1.5"/>
  <text x="200" y="232" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">GREEN &amp; PLASTIC-FREE</text>
</svg>
