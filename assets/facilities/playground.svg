<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="pgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#pgGrad)"/>
  
  <!-- Running Track Arcs / Sports Pitch -->
  <ellipse cx="200" cy="220" rx="170" ry="60" fill="none" stroke="#dc2626" stroke-width="12" opacity="0.8"/>
  <ellipse cx="200" cy="220" rx="170" ry="60" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Football Goalpost -->
  <g stroke="#ffffff" stroke-width="3" fill="none">
    <rect x="50" y="90" width="80" height="55" stroke="#ffffff" stroke-width="3"/>
    <line x1="50" y1="90" x2="35" y2="145"/>
    <line x1="130" y1="90" x2="145" y2="145"/>
    <!-- Goal Net Grid -->
    <path d="M 60 90 L 45 145 M 80 90 L 70 145 M 100 90 L 95 145 M 120 90 L 120 145" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <path d="M 46 110 L 134 110 M 40 130 L 140 130" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Volleyball / Badminton Net & Posts -->
  <g>
    <line x1="250" y1="80" x2="250" y2="150" stroke="#475569" stroke-width="3"/>
    <line x1="350" y1="80" x2="350" y2="150" stroke="#475569" stroke-width="3"/>
    <rect x="250" y="85" width="100" height="28" fill="#ffffff" opacity="0.3" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="250" y1="85" x2="350" y2="85" stroke="#f59e0b" stroke-width="2"/>
    <line x1="250" y1="113" x2="350" y2="113" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <!-- Sports Balls in foreground -->
  <!-- Football -->
  <circle cx="180" cy="180" r="18" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <polygon points="180,172 173,178 175,186 185,186 187,178" fill="#1e293b"/>
  <!-- Basketball -->
  <circle cx="230" cy="175" r="16" fill="#ea580c" stroke="#9a3412" stroke-width="2"/>
  <path d="M 214 175 C 225 170, 235 170, 246 175" stroke="#1e293b" stroke-width="1.5" fill="none"/>
  <line x1="230" y1="159" x2="230" y2="191" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Cricket Bat & Ball -->
  <rect x="280" y="160" width="10" height="35" rx="3" fill="#d97706" transform="rotate(35 280 160)"/>
  <circle cx="270" cy="190" r="7" fill="#dc2626"/>
</svg>
