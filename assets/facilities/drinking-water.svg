<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="dwGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="pureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#dwGrad)"/>
  
  <!-- RO Water Purification Station Unit -->
  <rect x="110" y="40" width="180" height="180" rx="10" fill="#f8fafc" stroke="#38bdf8" stroke-width="3"/>
  <rect x="125" y="55" width="150" height="35" rx="5" fill="#0284c7"/>
  <text x="200" y="77" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">RO PURIFIED WATER</text>

  <!-- Filter Indicators -->
  <circle cx="145" cy="115" r="14" fill="#38bdf8" opacity="0.3"/>
  <path d="M 145 106 C 141 113, 137 116, 137 120 A 8 8 0 0 0 153 120 C 153 116, 149 113, 145 106 Z" fill="#0284c7"/>

  <!-- Taps and Flow -->
  <rect x="190" y="105" width="20" height="10" fill="#94a3b8"/>
  <path d="M 200 115 L 200 135 L 195 135" stroke="#64748b" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Droplet stream -->
  <path d="M 195 140 C 195 148, 190 152, 195 160" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 2" fill="none"/>

  <!-- Glass / Stainless Steel Tumbler -->
  <polygon points="185,160 205,160 200,185 190,185" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="187,170 203,170 200,184 190,184" fill="#38bdf8" opacity="0.6"/>

  <!-- Certified Clean Shield Badge -->
  <circle cx="330" cy="80" r="32" fill="#10b981"/>
  <path d="M 320 80 L 327 87 L 342 72" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="125" font-family="sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">100% SAFE</text>
  <text x="330" y="137" font-family="sans-serif" font-size="8" fill="#a7f3d0" text-anchor="middle">RO + UV Treated</text>
</svg>
