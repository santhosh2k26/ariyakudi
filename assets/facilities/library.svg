<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="libGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#libGrad)"/>
  
  <!-- Bookshelf Frame -->
  <rect x="40" y="30" width="320" height="170" rx="4" fill="#78350f" stroke="#b45309" stroke-width="3"/>
  <line x1="40" y1="90" x2="360" y2="90" stroke="#b45309" stroke-width="4"/>
  <line x1="40" y1="150" x2="360" y2="150" stroke="#b45309" stroke-width="4"/>

  <!-- Shelf 1 Books -->
  <g>
    <rect x="55" y="45" width="14" height="45" fill="#ef4444" rx="1"/>
    <rect x="71" y="40" width="18" height="50" fill="#3b82f6" rx="1"/>
    <rect x="91" y="42" width="12" height="48" fill="#10b981" rx="1"/>
    <rect x="105" y="48" width="16" height="42" fill="#f59e0b" rx="1"/>
    <rect x="123" y="38" width="20" height="52" fill="#8b5cf6" rx="1"/>
    <rect x="145" y="44" width="15" height="46" fill="#ec4899" rx="1"/>
    <rect x="162" y="42" width="18" height="48" fill="#06b6d4" rx="1"/>
    <rect x="182" y="46" width="14" height="44" fill="#f97316" rx="1"/>
    <!-- Slanted Books -->
    <path d="M 205 90 L 225 50 L 238 55 L 218 90 Z" fill="#eab308"/>
    <path d="M 221 90 L 239 56 L 250 60 L 232 90 Z" fill="#3b82f6"/>
    
    <rect x="270" y="40" width="22" height="50" fill="#64748b" rx="1"/>
    <rect x="294" y="43" width="18" height="47" fill="#14b8a6" rx="1"/>
    <rect x="314" y="38" width="24" height="52" fill="#a855f7" rx="1"/>
  </g>

  <!-- Shelf 2 Books -->
  <g>
    <rect x="55" y="105" width="20" height="45" fill="#3b82f6" rx="1"/>
    <rect x="77" y="100" width="15" height="50" fill="#ef4444" rx="1"/>
    <rect x="94" y="108" width="22" height="42" fill="#10b981" rx="1"/>
    <rect x="118" y="102" width="16" height="48" fill="#fbbf24" rx="1"/>
    <!-- Globe on shelf -->
    <circle cx="165" cy="120" r="18" fill="#0284c7"/>
    <ellipse cx="165" cy="120" rx="18" ry="7" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="165" y1="102" x2="165" y2="138" stroke="#ffffff" stroke-width="1.2"/>
    <path d="M 165 140 L 165 150 M 155 150 L 175 150" stroke="#d97706" stroke-width="2.5"/>

    <rect x="200" y="102" width="22" height="48" fill="#f97316" rx="1"/>
    <rect x="224" y="106" width="18" height="44" fill="#8b5cf6" rx="1"/>
    <rect x="244" y="100" width="26" height="50" fill="#0ea5e9" rx="1"/>
    <rect x="272" y="105" width="16" height="45" fill="#22c55e" rx="1"/>
    <rect x="290" y="103" width="20" height="47" fill="#e11d48" rx="1"/>
    <rect x="312" y="107" width="24" height="43" fill="#ca8a04" rx="1"/>
  </g>

  <!-- Reading Desk & Lamp in foreground -->
  <rect x="80" y="210" width="240" height="15" rx="3" fill="#92400e" stroke="#78350f"/>
  <!-- Open Book on Desk -->
  <path d="M 170 215 C 185 208, 195 208, 200 212 C 205 208, 215 208, 230 215 L 228 223 C 215 218, 205 218, 200 220 C 195 218, 185 218, 172 223 Z" fill="#ffffff" stroke="#cbd5e1"/>
  <!-- Lamp -->
  <path d="M 120 210 L 120 180 Q 120 165 135 165 L 145 165" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <path d="M 140 160 L 155 170 L 135 170 Z" fill="#f59e0b"/>
  <polygon points="135,170 115,215 165,215 155,170" fill="#fef08a" opacity="0.25"/>
</svg>
