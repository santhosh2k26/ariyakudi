<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#pGrad)"/>
  <!-- Decorative border ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.3"/>
  <circle cx="200" cy="200" r="170" fill="#1e3a8a" opacity="0.2"/>
  
  <!-- Silhouette / Stylized Avatar of Principal with Academic Stole -->
  <!-- Head -->
  <circle cx="200" cy="140" r="55" fill="url(#avatarGrad)"/>
  <!-- Hair / Formal style outline -->
  <path d="M 145 135 C 145 85, 255 85, 255 135 C 255 100, 245 90, 200 90 C 155 90, 145 100, 145 135 Z" fill="#475569"/>
  <!-- Glasses -->
  <rect x="165" y="130" width="28" height="18" rx="4" fill="none" stroke="#334155" stroke-width="3"/>
  <rect x="207" y="130" width="28" height="18" rx="4" fill="none" stroke="#334155" stroke-width="3"/>
  <line x1="193" y1="138" x2="207" y2="138" stroke="#334155" stroke-width="3"/>
  
  <!-- Shoulders & Academic Blazer -->
  <path d="M 100 340 C 100 240, 140 210, 200 210 C 260 210, 300 240, 300 340 Z" fill="#0f2b5c"/>
  <!-- White Shirt Collar & Tie -->
  <polygon points="200,215 175,260 200,275 225,260" fill="#ffffff"/>
  <polygon points="200,225 194,310 200,335 206,310" fill="#f59e0b"/>
  <!-- Blazer Lapels -->
  <path d="M 155 225 L 180 300 L 140 340 Z" fill="#1e3a8a"/>
  <path d="M 245 225 L 220 300 L 260 340 Z" fill="#1e3a8a"/>
  
  <!-- Badge / Pin -->
  <circle cx="170" cy="275" r="7" fill="#fbbf24"/>
  
  <!-- Educational Emblem Accent -->
  <rect x="50" y="320" width="300" height="60" rx="10" fill="#0f172a" opacity="0.85" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="200" y="348" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">HEADMASTER / PRINCIPAL</text>
  <text x="200" y="366" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">GHSS Ariyakudi</text>
</svg>
