<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="transGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#transGrad)"/>
  
  <!-- Road -->
  <rect y="195" width="400" height="65" fill="#334155"/>
  <line x1="20" y1="230" x2="80" y2="230" stroke="#f8fafc" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="120" y1="230" x2="180" y2="230" stroke="#f8fafc" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="220" y1="230" x2="280" y2="230" stroke="#f8fafc" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="320" y1="230" x2="380" y2="230" stroke="#f8fafc" stroke-width="3" stroke-dasharray="10 10"/>

  <!-- Yellow School Bus / Transit Vehicle -->
  <rect x="60" y="80" width="280" height="110" rx="14" fill="url(#busGrad)" stroke="#ca8a04" stroke-width="2"/>
  
  <!-- Roof Accent -->
  <path d="M 75 80 L 325 80" stroke="#a16207" stroke-width="4"/>

  <!-- Windshield & Windows -->
  <rect x="75" y="95" width="45" height="45" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="130" y="95" width="40" height="45" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="180" y="95" width="40" height="45" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="230" y="95" width="40" height="45" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <rect x="280" y="95" width="45" height="45" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>

  <!-- Bus Body Side Stripe & Text -->
  <rect x="60" y="148" width="280" height="16" fill="#1e293b"/>
  <text x="200" y="160" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">GHSS ARIYAKUDI</text>

  <!-- Headlights & Taillights -->
  <circle cx="68" cy="172" r="6" fill="#fef08a"/>
  <rect x="332" y="168" width="6" height="10" rx="2" fill="#ef4444"/>

  <!-- Wheels -->
  <!-- Left Wheel -->
  <circle cx="120" cy="195" r="22" fill="#1e293b"/>
  <circle cx="120" cy="195" r="12" fill="#64748b"/>
  <circle cx="120" cy="195" r="4" fill="#cbd5e1"/>

  <!-- Right Wheel -->
  <circle cx="280" cy="195" r="22" fill="#1e293b"/>
  <circle cx="280" cy="195" r="12" fill="#64748b"/>
  <circle cx="280" cy="195" r="4" fill="#cbd5e1"/>
</svg>
