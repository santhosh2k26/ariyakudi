<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="sciGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#sciGrad)"/>
  <!-- Lab Bench -->
  <rect x="30" y="190" width="340" height="15" rx="3" fill="#334155"/>
  <rect x="50" y="205" width="300" height="45" fill="#1e293b"/>
  
  <!-- Microscope -->
  <path d="M 90 190 L 130 190 M 110 190 L 110 130 Q 110 100 135 100 L 150 100" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="110" cy="140" r="14" fill="#64748b"/>
  <line x1="150" y1="90" x2="135" y2="135" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <rect x="120" y="150" width="30" height="6" fill="#e2e8f0"/>
  
  <!-- Flasks & Beakers with Glowing Chemicals -->
  <!-- Flask 1 -->
  <path d="M 200 120 L 215 120 L 215 140 L 235 185 L 180 185 L 200 140 Z" fill="#0284c7" opacity="0.8" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="205" cy="165" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="218" cy="155" r="3" fill="#ffffff" opacity="0.6"/>
  
  <!-- Flask 2 (Conical with Emerald Liquid) -->
  <path d="M 260 100 L 275 100 L 275 130 L 305 185 L 230 185 L 260 130 Z" fill="#10b981" opacity="0.85" stroke="#34d399" stroke-width="2"/>
  <circle cx="270" cy="160" r="5" fill="#ffffff" opacity="0.7"/>
  <circle cx="255" cy="170" r="3.5" fill="#ffffff" opacity="0.7"/>

  <!-- Bunsen Burner & Blue Flame -->
  <rect x="330" y="175" width="25" height="15" fill="#64748b"/>
  <path d="M 342.5 175 C 336 155, 349 155, 342.5 140 C 338 155, 350 160, 342.5 175 Z" fill="#38bdf8"/>
  <path d="M 342.5 175 C 339 162, 346 162, 342.5 152 Z" fill="#fef08a"/>

  <!-- Molecular Structure in Background -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.3" fill="#10b981">
    <line x1="60" y1="50" x2="100" y2="70"/>
    <line x1="100" y1="70" x2="100" y2="110"/>
    <line x1="100" y1="110" x2="60" y2="130"/>
    <circle cx="60" cy="50" r="6"/>
    <circle cx="100" cy="70" r="6"/>
    <circle cx="100" cy="110" r="6"/>
    <circle cx="60" cy="130" r="6"/>
  </g>
</svg>
