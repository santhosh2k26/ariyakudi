<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gCamp1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#gCamp1)"/>
  <!-- School Campus Arch & Entrance View -->
  <rect y="260" width="600" height="140" fill="#15803d"/>
  <path d="M 0 280 Q 300 240 600 280 L 600 400 L 0 400 Z" fill="#166534"/>
  <!-- Building Silhouette -->
  <rect x="100" y="140" width="400" height="140" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="80,140 300,70 520,140" fill="#991b1b"/>
  <!-- Arch Gate -->
  <path d="M 230 280 L 230 180 Q 300 130 370 180 L 370 280 Z" fill="#0f2b5c"/>
  <text x="300" y="165" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">MAIN CAMPUS GATE</text>
  <!-- Flag -->
  <line x1="300" y1="70" x2="300" y2="30" stroke="#475569" stroke-width="3"/>
  <rect x="302" y="30" width="30" height="6" fill="#f97316"/>
  <rect x="302" y="36" width="30" height="6" fill="#ffffff"/>
  <rect x="302" y="42" width="30" height="6" fill="#16a34a"/>
  <!-- Trees -->
  <circle cx="60" cy="240" r="50" fill="#22c55e"/>
  <circle cx="540" cy="240" r="50" fill="#22c55e"/>
  <!-- Caption tag -->
  <rect x="20" y="350" width="220" height="32" rx="6" fill="#0f172a" opacity="0.85"/>
  <text x="30" y="371" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">GHSS Ariyakudi Campus</text>
</svg>
