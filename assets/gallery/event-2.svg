      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#gEve2)"/>
  <!-- Science & Project Exhibition Hall -->
  <rect x="50" y="40" width="500" height="60" rx="8" fill="#0369a1"/>
  <text x="300" y="75" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">DISTRICT LEVEL SCIENCE EXHIBITION</text>
  <!-- Exhibition Tables -->
  <rect x="60" y="180" width="200" height="120" fill="#334155" rx="4"/>
  <rect x="340" y="180" width="200" height="120" fill="#334155" rx="4"/>
  <!-- Models on Tables (Volcano, Windmill, Solar panel) -->
  <polygon points="120,180 160,130 200,180" fill="#78350f"/>
  <circle cx="160" cy="120" r="10" fill="#ef4444"/>
  <line x1="440" y1="180" x2="440" y2="120" stroke="#f8fafc" stroke-width="3"/>
  <circle cx="440" cy="120" r="6" fill="#38bdf8"/>
  <line x1="440" y1="120" x2="415" y2="100" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="440" y1="120" x2="465" y2="100" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="440" y1="120" x2="440" y2="150" stroke="#38bdf8" stroke-width="2.5"/>
  
  <rect x="20" y="350" width="220" height="32" rx="6" fill="#0f172a" opacity="0.85"/>
  <text x="30" y="371" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">Science Fair &amp; Innovation Expo</text>
