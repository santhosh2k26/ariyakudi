<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Sun & Clouds -->
  <circle cx="680" cy="90" r="50" fill="url(#sunGrad)" opacity="0.9"/>
  <circle cx="680" cy="90" r="65" fill="#fef08a" opacity="0.3"/>
  <path d="M 120 90 Q 140 70 170 75 Q 190 60 220 70 Q 250 65 270 85 Q 280 100 260 110 L 130 110 Q 110 105 120 90 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M 520 120 Q 540 100 570 105 Q 590 90 620 100 Q 640 115 620 130 L 510 130 Q 500 120 520 120 Z" fill="#ffffff" opacity="0.75"/>

  <!-- Background hills/greenery -->
  <path d="M 0 320 Q 200 240 400 290 Q 600 250 800 310 L 800 500 L 0 500 Z" fill="#22c55e" opacity="0.35"/>
  <path d="M 0 340 Q 300 280 550 330 Q 700 290 800 340 L 800 500 L 0 500 Z" fill="#16a34a" opacity="0.5"/>

  <!-- Campus Lawn -->
  <rect y="360" width="800" height="140" fill="url(#grassGrad)"/>
  <!-- Pathway -->
  <polygon points="340,500 460,500 420,380 380,380" fill="#cbd5e1"/>

  <!-- School Main Building Architecture (Modern Higher Secondary School) -->
  <!-- Left Wing -->
  <rect x="140" y="240" width="160" height="130" fill="url(#buildingGrad)" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="130,240 220,195 310,240" fill="url(#roofGrad)"/>
  <!-- Right Wing -->
  <rect x="500" y="240" width="160" height="130" fill="url(#buildingGrad)" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="490,240 580,195 670,240" fill="url(#roofGrad)"/>

  <!-- Central Administrative Block & Clock Tower / Dome -->
  <rect x="280" y="200" width="240" height="170" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <!-- Central Pediment / Triangular roof -->
  <polygon points="265,200 400,130 535,200" fill="url(#roofGrad)" stroke="#7f1d1d" stroke-width="1.5"/>
  
  <!-- Clock / Emblem in Pediment -->
  <circle cx="400" cy="170" r="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="400" cy="170" r="2" fill="#0f172a"/>
  <line x1="400" y1="170" x2="400" y2="158" stroke="#0f172a" stroke-width="2"/>
  <line x1="400" y1="170" x2="408" y2="170" stroke="#0f172a" stroke-width="2"/>

  <!-- School Signboard on Building -->
  <rect x="300" y="215" width="200" height="28" rx="4" fill="#0f2b5c"/>
  <text x="400" y="234" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="1">GHSS ARIYAKUDI</text>

  <!-- Windows Grid -->
  <!-- Left Wing Windows -->
  <g fill="#38bdf8" stroke="#0284c7" stroke-width="1">
    <rect x="160" y="255" width="25" height="35" rx="2"/>
    <rect x="200" y="255" width="25" height="35" rx="2"/>
    <rect x="240" y="255" width="25" height="35" rx="2"/>
    <rect x="160" y="305" width="25" height="35" rx="2"/>
    <rect x="200" y="305" width="25" height="35" rx="2"/>
    <rect x="240" y="305" width="25" height="35" rx="2"/>
  </g>

  <!-- Right Wing Windows -->
  <g fill="#38bdf8" stroke="#0284c7" stroke-width="1">
    <rect x="535" y="255" width="25" height="35" rx="2"/>
    <rect x="575" y="255" width="25" height="35" rx="2"/>
    <rect x="615" y="255" width="25" height="35" rx="2"/>
    <rect x="535" y="305" width="25" height="35" rx="2"/>
    <rect x="575" y="305" width="25" height="35" rx="2"/>
    <rect x="615" y="305" width="25" height="35" rx="2"/>
  </g>

  <!-- Central Pillars & Main Entrance -->
  <rect x="310" y="260" width="14" height="110" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="350" y="260" width="14" height="110" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="436" y="260" width="14" height="110" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="476" y="260" width="14" height="110" fill="#f1f5f9" stroke="#cbd5e1"/>

  <!-- Grand Entrance Arch -->
  <path d="M 375 370 L 375 285 Q 400 265 425 285 L 425 370 Z" fill="#0f2b5c"/>
  <path d="M 380 370 L 380 290 Q 400 273 420 290 L 420 370 Z" fill="#1e293b"/>
  <!-- Steps -->
  <rect x="360" y="365" width="80" height="7" rx="1" fill="#94a3b8"/>
  <rect x="350" y="372" width="100" height="8" rx="1" fill="#64748b"/>

  <!-- Flagpole & Indian National Flag -->
  <line x1="400" y1="130" x2="400" y2="70" stroke="#475569" stroke-width="3"/>
  <circle cx="400" cy="68" r="4" fill="#f59e0b"/>
  <!-- Tricolor Flag -->
  <rect x="402" y="70" width="40" height="7" fill="#ff9933"/>
  <rect x="402" y="77" width="40" height="7" fill="#ffffff"/>
  <rect x="402" y="84" width="40" height="7" fill="#128807"/>
  <circle cx="422" cy="80.5" r="3" fill="none" stroke="#000088" stroke-width="0.8"/>

  <!-- Campus Trees & Flora -->
  <!-- Left Tree -->
  <rect x="70" y="320" width="18" height="90" fill="#78350f" rx="3"/>
  <circle cx="79" cy="290" r="45" fill="#15803d"/>
  <circle cx="65" cy="270" r="35" fill="#22c55e"/>
  <circle cx="95" cy="275" r="35" fill="#16a34a"/>

  <!-- Right Tree -->
  <rect x="715" y="315" width="18" height="95" fill="#78350f" rx="3"/>
  <circle cx="724" cy="285" r="48" fill="#15803d"/>
  <circle cx="705" cy="265" r="38" fill="#22c55e"/>
  <circle cx="740" cy="270" r="38" fill="#16a34a"/>

  <!-- Decorative Flower Bushes -->
  <path d="M 120 380 Q 140 350 160 380 Q 180 355 200 380 Z" fill="#10b981"/>
  <circle cx="140" cy="365" r="4" fill="#f43f5e"/>
  <circle cx="180" cy="368" r="4" fill="#fbbf24"/>

  <path d="M 600 380 Q 620 350 640 380 Q 660 355 680 380 Z" fill="#10b981"/>
  <circle cx="620" cy="365" r="4" fill="#f43f5e"/>
  <circle cx="660" cy="368" r="4" fill="#fbbf24"/>
</svg>
