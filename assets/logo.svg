<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Crest Shield -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-dasharray="2 1"/>
  <circle cx="60" cy="60" r="51" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Golden Laurel Wreath / Ring Arc -->
  <path d="M 22 65 C 20 40, 40 20, 60 20 C 80 20, 100 40, 98 65" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3"/>

  <!-- Central Emblem: Open Book & Torch of Knowledge -->
  <!-- Torch Flames -->
  <path d="M 60 26 C 56 33, 54 37, 56 42 C 58 46, 62 46, 64 42 C 66 37, 64 33, 60 26 Z" fill="url(#goldGrad)"/>
  <path d="M 60 31 C 58 35, 57 38, 58 41 C 59 43, 61 43, 62 41 C 63 38, 62 35, 60 31 Z" fill="#ffffff" opacity="0.8"/>
  <rect x="58.5" y="42" width="3" height="6" rx="1" fill="#f59e0b"/>

  <!-- Open Book -->
  <path d="M 60 52 C 53 47, 39 48, 32 52 L 32 68 C 39 64, 53 63, 60 68 C 67 63, 81 64, 88 68 L 88 52 C 81 48, 67 47, 60 52 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <path d="M 60 52 L 60 68" stroke="#1e3a8a" stroke-width="1.5"/>
  <path d="M 37 57 C 43 54, 52 54, 56 56" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <path d="M 37 61 C 43 58, 52 58, 56 60" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <path d="M 64 56 C 68 54, 77 54, 83 57" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <path d="M 64 60 C 68 58, 77 58, 83 61" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>

  <!-- Rising Sun Behind Horizon -->
  <circle cx="60" cy="49" r="6" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- Tamil Nadu / Ariyakudi Education Ribbon / Text Arc -->
  <path d="M 28 85 Q 60 76 92 85 L 94 92 Q 60 83 26 92 Z" fill="url(#goldGrad)"/>
  <text x="60" y="89" font-family="'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="900" fill="#0f2b5c" text-anchor="middle" letter-spacing="1">GHSS ARIYAKUDI</text>

  <!-- Stars -->
  <polygon points="60,96 61.5,99 65,99.5 62.5,102 63,105 60,103.5 57,105 57.5,102 55,99.5 58.5,99" fill="url(#goldGrad)"/>
</svg>
