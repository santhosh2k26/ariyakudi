<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="scGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#scGrad)"/>
  <!-- Interactive Smart Board Frame -->
  <rect x="50" y="30" width="300" height="170" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
  <rect x="60" y="40" width="280" height="150" rx="4" fill="url(#screenGrad)"/>
  
  <!-- Digital Content on Smart Board -->
  <!-- Header Bar -->
  <rect x="70" y="50" width="260" height="15" rx="3" fill="#0f172a" opacity="0.3"/>
  <circle cx="80" cy="57.5" r="4" fill="#ef4444"/>
  <circle cx="92" cy="57.5" r="4" fill="#f59e0b"/>
  <circle cx="104" cy="57.5" r="4" fill="#10b981"/>
  <text x="200" y="61" font-family="sans-serif" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">SMART CLASSROOM • DIGITAL LEARNING</text>
  
  <!-- Solar System / Geometry Graphic on Board -->
  <circle cx="140" cy="120" r="30" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="140" cy="120" r="14" fill="#fbbf24"/>
  <circle cx="165" cy="105" r="6" fill="#38bdf8"/>
  <circle cx="115" cy="135" r="4" fill="#34d399"/>
  
  <!-- Graph / Math Equations -->
  <path d="M 210 145 L 230 110 L 255 130 L 285 85" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
  <text x="220" y="165" font-family="monospace" font-size="11" fill="#ffffff">E = mc²  |  πr²</text>
  <text x="220" y="180" font-family="monospace" font-size="10" fill="#fef08a">Interactive Audio-Visual</text>
  
  <!-- Stylized Desks & Chairs in front -->
  <rect x="100" y="215" width="200" height="12" rx="3" fill="#475569"/>
  <rect x="120" y="227" width="8" height="25" fill="#334155"/>
  <rect x="272" y="227" width="8" height="25" fill="#334155"/>
  <path d="M 180 230 Q 200 215 220 230" stroke="#f59e0b" stroke-width="2" fill="none"/>
</svg>
